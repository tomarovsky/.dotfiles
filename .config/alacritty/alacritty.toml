[window]
opacity = 1.0

[font]
builtin_box_drawing = true
normal.family = "JetBrains Mono"
bold.family = "JetBrains Mono"
italic.family = "JetBrains Mono"
bold_italic.family = "JetBrains Mono"
size = 12

[cursor.style]
shape = "Block"
blinking = "Never"

[selection]
save_to_clipboard = true

# ─────────────────────────────────────────────
# Keybindings
# ─────────────────────────────────────────────

[[keyboard.bindings]]
key = "V"
mods = "Control"
action = "Paste"

[[keyboard.bindings]]
key = "М"
mods = "Control"
action = "Paste"

# ─────────────────────────────────────────────
# Gruvbox
# ─────────────────────────────────────────────

[colors.primary]
background = "#000000"
foreground = "#dddddd"

[colors.normal]
black   = "#282828"
red     = "#cc241d"
green   = "#98971a"
yellow  = "#d79921"
blue    = "#458588"
magenta = "#b16286"
cyan    = "#689d6a"
white   = "#a89984"

[colors.bright]
black   = "#928374"
red     = "#fb4934"
green   = "#b8bb26"
yellow  = "#fabd2f"
blue    = "#83a598"
magenta = "#d3869b"
cyan    = "#8ec07c"
white   = "#ebdbb2"
