enable_audio_bell no

# Font
font_family      JetBrains Mono
bold_font        auto
italic_font      auto
bold_italic_font auto
font_size        12

# Window
background_opacity 1.0

# Cursor
shell_integration no-title no-cursor
cursor_shape          block
cursor_blink_interval 0
cursor_trail 3
cursor_trail_start_threshold 20

# Selection → системный буфер
copy_on_select clipboard

# Keybindings
map ctrl+v paste_from_clipboard
kitty_mod ctrl+shift
enabled_layouts splits,stack
map kitty_mod+enter no_op
map kitty_mod+p launch --location=vsplit --cwd=current
map kitty_mod+s launch --location=hsplit --cwd=current
map kitty_mod+h neighboring_window left
map kitty_mod+j neighboring_window bottom
map kitty_mod+k neighboring_window top
map kitty_mod+l neighboring_window right

# Gruvbox
# normal
color0  #282828
color1  #cc241d
color2  #98971a
color3  #d79921
color4  #458588
color5  #b16286
color6  #689d6a
color7  #a89984

# bright
color8  #928374
color9  #fb4934
color10 #b8bb26
color11 #fabd2f
color12 #83a598
color13 #d3869b
color14 #8ec07c
color15 #ebdbb2

