term xterm-256color
enable_audio_bell no
confirm_os_window_close 0

# ── Font ──────────────────────────────────────────────
font_family      JetBrainsMono Nerd Font Mono
bold_font        auto
italic_font      auto
bold_italic_font auto
font_size        12

# ── Window ────────────────────────────────────────────
background_opacity 1.0
enabled_layouts     splits,stack

# ── Cursor ────────────────────────────────────────────
shell_integration            no-title no-cursor
cursor_shape                 block
cursor_blink_interval        0
cursor_trail                 3
cursor_trail_start_threshold 20

# ── Selection → clipboard ──────────────────────────────
copy_on_select clipboard

# ── Tab bar ────────────────────────────────────────────
tab_bar_edge         bottom
tab_bar_style        fade
tab_fade             1
tab_title_template   {title}{' :{}:'.format(num_windows) if num_windows > 1 else ''}
# new tabs open in the current directory
map ctrl+shift+t new_tab_with_cwd

# ── Keybindings ───────────────────────────────────────
kitty_mod ctrl+shift

map --allow-fallback=shifted,ascii ctrl+v paste_from_clipboard
map kitty_mod+enter no_op

# Tabs
map --allow-fallback=shifted,ascii kitty_mod+[ previous_tab
map --allow-fallback=shifted,ascii kitty_mod+] next_tab

# Splits / windows
map --allow-fallback=shifted,ascii kitty_mod+p launch --location=vsplit --cwd=current
map --allow-fallback=shifted,ascii kitty_mod+s launch --location=hsplit --cwd=current
map --allow-fallback=shifted,ascii kitty_mod+h neighboring_window left
map --allow-fallback=shifted,ascii kitty_mod+j neighboring_window bottom
map --allow-fallback=shifted,ascii kitty_mod+k neighboring_window top
map --allow-fallback=shifted,ascii kitty_mod+l neighboring_window right

# Font size
map --allow-fallback=shifted,ascii ctrl+equal change_font_size all +2.0
map --allow-fallback=shifted,ascii ctrl+plus  change_font_size all +2.0
map --allow-fallback=shifted,ascii ctrl+minus change_font_size all -2.0
map --allow-fallback=shifted,ascii ctrl+0     change_font_size all 0

include themes/noctalia.conf
